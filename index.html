<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malerarbeiten – Monatlicher Stundenrapport</title><style>
:root{--navy:#1b3853;--line:#415b70;--pale:#e8f0f5}*{box-sizing:border-box}body{margin:0;background:#e8edf1;color:#1b3853;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;background:#fff;box-shadow:0 2px 8px #0002}.toolbar button,.toolbar label{font-size:14px;background:#1b3853;color:white;border:0;border-radius:6px;padding:10px 13px;cursor:pointer}.toolbar .hint{font-size:12px;color:#475569}.sheet{background:white;width:210mm;min-height:297mm;margin:16px auto;padding:4.8mm 5mm 7mm;box-shadow:0 2px 16px #0002}.head{background:var(--navy);color:white;height:16mm;border-radius:2mm 2mm 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 7mm;border-bottom:2px solid #55a3c9}.head strong{font-size:19px;letter-spacing:.2px}.head span{font-size:9px;letter-spacing:.3px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm;margin:8mm 0 5mm}.meta label{font-size:9px;font-weight:700;color:#61788b}.meta input{display:block;width:100%;height:8mm;border:0;border-bottom:1px solid #8da0b0;border-radius:0;background:transparent;color:var(--navy);font-size:13px;outline:none}.meta label:last-child{grid-column:1}.report{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}.report th,.report td{border:1px solid var(--line);padding:0}.report thead th{height:10mm;background:var(--pale);font-size:9px;text-align:center}.report tbody tr{height:6.9mm}.report tbody tr:nth-child(even){background:#f5f7f9}.report td.day{text-align:center;font-weight:700;width:16mm}.report td input{width:100%;height:6.7mm;border:0;padding:0 2mm;background:transparent;font:12px Arial;color:#1b3853;outline:none}.report td.hours input{text-align:center;font-weight:600}.report tfoot td{height:9mm;background:var(--pale);font-weight:bold;font-size:11px;padding-left:3mm}.report tfoot td:last-child{text-align:center;padding:0;font-size:13px}.foot{display:flex;justify-content:space-between;margin-top:10mm;font-size:9px;color:#728497}.scroll{overflow:auto;padding:0 10px 15px}.sheet input:focus{background:#fff5d7!important;outline:2px solid #66a9d1}.status{font-size:12px;color:#42677b} @media(max-width:830px){.sheet{margin:8px auto}.scroll{padding:0 8px 20px}}@media print{@page{size:A4;margin:0}body{background:white}.toolbar{display:none}.scroll{overflow:visible;padding:0}.sheet{box-shadow:none;margin:0;width:210mm;height:297mm;min-height:0;break-after:avoid}.report tbody tr{height:6.9mm}input{print-color-adjust:exact;-webkit-print-color-adjust:exact}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="toolbar"><button onclick="window.print()">Drucken / Als PDF sichern</button><button onclick="exportData()">Daten sichern</button><label for="importFile">Daten laden</label><input id="importFile" type="file" accept="application/json" style="display:none"><span class="status" id="status">Automatische Monatsberechnung</span><span class="hint">Auf dem iPhone ggf. seitlich scrollen oder zoomen</span></div><div class="scroll"><main class="sheet"><header class="head"><strong>MALERARBEITEN</strong><span>MONATLICHER STUNDENRAPPORT</span></header><section class="meta"><label>NAME / VORNAME<input id="name" autocomplete="name"></label><label>FIRMA<input id="firma"></label><label>MONAT / JAHR<input id="monat" placeholder="z. B. 11 / 2026"></label></section><table class="report"><colgroup><col style="width:16mm"><col style="width:20mm"><col><col style="width:26mm"></colgroup><thead><tr><th>TAG</th><th>ZUSATZ</th><th>ARBEITSORT / BAUSTELLE</th><th>TOTAL STUNDEN</th></tr></thead><tbody id="rows"></tbody><tfoot><tr><td colspan="3">TOTAL STUNDEN IM MONAT</td><td id="total">0,00</td></tr></tfoot></table><footer class="foot"><span>Stundenrapport · Täglich ausfüllen und speichern</span><span>A4 · 1 Seite · Tablet-Formular</span></footer></main></div><script>
const tbody=document.getElementById('rows');for(let i=1;i<=31;i++){let d=String(i).padStart(2,'0');let tr=document.createElement('tr');tr.innerHTML=`<td class="day">${d}</td><td><input aria-label="Zusatz Tag ${d}" id="z${d}"></td><td><input aria-label="Arbeitsort Tag ${d}" id="o${d}"></td><td class="hours"><input inputmode="decimal" aria-label="Stunden Tag ${d}" id="h${d}" placeholder=""></td>`;tbody.appendChild(tr)}
const fields=[...document.querySelectorAll('input:not([type=file])')];function calculate(){let total=0;for(let i=1;i<=31;i++){let d=String(i).padStart(2,'0'),v=document.getElementById('h'+d).value.trim().replace(',','.');let n=Number(v);if(v!==''&&Number.isFinite(n)&&n>=0)total+=n}document.getElementById('total').textContent=total.toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function save(){try{let data={};fields.forEach(x=>data[x.id]=x.value);localStorage.setItem('malerarbeiten_rapport_uebersicht',JSON.stringify(data));document.getElementById('status').textContent='Gespeichert auf diesem Gerät'}catch(e){document.getElementById('status').textContent='Bitte Daten sichern (Datei)'}calculate()}
fields.forEach(x=>x.addEventListener('input',save));try{let data=JSON.parse(localStorage.getItem('malerarbeiten_rapport_uebersicht')||'{}');fields.forEach(x=>{if(typeof data[x.id]==='string')x.value=data[x.id]})}catch(e){}calculate();
function exportData(){let data={};fields.forEach(x=>data[x.id]=x.value);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Stundenrapport_'+(document.getElementById('monat').value.replace(/[^0-9a-zA-Z-]/g,'_')||'Monat')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());fields.forEach(x=>{if(typeof data[x.id]==='string')x.value=data[x.id]});save()}catch(e){alert('Datei konnte nicht gelesen werden.')}e.target.value=''})
</script></body></html>
